<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全家逃離指南:通靈點餐機</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fff0f5; display: flex; justify-content: center; padding: 20px; position: relative; min-height: 100vh; }
        .app-card { background: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(255,182,193,0.3); position: relative; z-index: 1;}
        h2 { text-align: center; color: #ff69b4; margin-bottom: 5px; }
        .sub { text-align: center; color: #ffb6c1; font-size: 13px; margin-bottom: 25px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #ff69b4; }
        select, button { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #ffe4e1; font-size: 16px; margin-top: 5px; }
        .btn-main { background: #ff69b4; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-main:hover { background: #ff1493; }
        .result-box { margin-top: 20px; padding: 15px; background: #fffafa; border-radius: 10px; border: 1px solid #ffe4e1; max-height: 350px; overflow-y: auto; }
        .btn-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; justify-content: center;}
        
        /* 更新按鈕樣式使其並排 */
        .btn-confirm { flex: 1; background: #ff1493; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; min-width: 80px;}
        .btn-rand { flex: 1; background: #ff69b4; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; min-width: 80px;}
        
        .btn-reset { background: #ffb6c1; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .list-item { margin-bottom: 10px; border-bottom: 1px solid #ffe4e1; padding-bottom: 8px; display: flex; align-items: flex-start;}
        
        .select-check { margin-top: 5px; margin-right: 12px; transform: scale(1.3); cursor: pointer;}
        .list-item-content { flex: 1; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; width: 80%; max-width: 320px; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center;}
        .modal-name { font-size: 20px; font-weight: bold; color: #ff69b4; margin-bottom: 20px; border: 2px solid #ffe4e1; padding: 10px; border-radius: 8px; }
        .modal-btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .btn-modal-re { flex: 1; background: #ffb6c1; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-modal-google { flex: 1; background: #34a853; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block;}
    </style>
</head>
<body>
<div class="app-card">
    <h2>全家逃離指南:通靈點餐機</h2>
    <div class="sub">校園周邊美食隨機推薦系統</div>
    
    <div id="setupArea">
        <label>🕒 時段</label>
        <select id="timeSelect" onchange="toggleTypeSelect()">
            <option value="早">早餐</option><option value="午" selected>午餐</option>
            <option value="晚">晚餐</option><option value="點">點心</option>
        </select>
        
        <div id="typeArea">
            <label>🍱 種類</label>
            <select id="typeSelect">
                <option value="西式">1. 西式</option><option value="日式">2. 日式</option>
                <option value="韓式">3. 韓式</option><option value="中式">4. 中式</option>
                <option value="其他">5. 其他</option><option value="都可" selected>6. 都可</option>
            </select>
        </div>
        
        <label>💰 預算</label>
        <select id="priceSelect">
            <option value="100以下">100以下</option><option value="100~200" selected>100~200</option>
            <option value="200以上">200以上</option><option value="不限">不限</option>
        </select>

        <label>🛵 騎車時間</label>
        <select id="distSelect">
            <option value="5">5分鐘內</option><option value="10">10分鐘內</option>
            <option value="15">15分鐘內</option><option value="999" selected>不限距離</option>
        </select>

        <button class="btn-main" onclick="initialSearch()">🔍 搜尋全名單</button>
    </div>

    <div id="resultArea" class="result-box" style="display:none;"></div>
    
    <div id="actionArea" style="display:none; text-align:center; margin-top:15px;">
        <div style="font-weight:bold; color:#ff69b4;">🤔 決定好了嗎？</div>
        <div class="btn-row">
            <button class="btn-confirm" onclick="confirmSelection()">✅ 確認勾選</button>
            <button class="btn-rand" onclick="drawMore()">🎲 隨便抽</button>
        </div>
    </div>

    <div id="restartArea" style="display:none; text-align:center;">
        <button class="btn-reset" onclick="resetApp()">🔄 全新通靈 (重置)</button>
    </div>
</div>

<div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
        <div id="modalRestaurantName" class="modal-name">店名佔位符</div>
        <div class="modal-btn-row">
            <button class="btn-modal-re" onclick="modalRestart()">重新</button>
            <a id="modalGoogleLink" href="#" target="_blank" class="btn-modal-google">Google Map</a>
        </div>
    </div>
</div>

<script>
const data = [
    {name:"華陽豆漿", price:"100以下", time:"早", dist:5, type:"無"},
    {name:"街口飯糰", price:"100以下", time:"早", dist:10, type:"無"},
    {name:"白鳥餐點店", price:"100以下", time:"早", dist:5, type:"無"},
    {name:"長江早餐店", price:"100以下", time:"早", dist:5, type:"無"},
    {name:"Q Burger", price:"100以下", time:"早", dist:5, type:"無"},
    {name:"維亞歐式早餐", price:"100~200", time:"早", dist:5, type:"無"},
    {name:"巴特手作晨食", price:"100~200", time:"早", dist:10, type:"無"},
    {name:"阿寶 A-Bao", price:"100以下", time:"早", dist:5, type:"無"},
    {name:"三豆二麥", price:"100以下", time:"早", dist:10, type:"無"},
    {name:"餅霸天下", price:"100以下", time:"早", dist:15, type:"無"},
    {name:"食鮮森鐵板燒", price:"100~200", time:"午晚", dist:10, type:"中式"},
    {name:"蓋飯家族", price:"100~200", time:"午晚", dist:15, type:"中式"},
    {name:"飽米便當", price:"100以下", time:"午晚", dist:5, type:"中式"},
    {name:"阿章控肉飯", price:"100以下", time:"午晚", dist:5, type:"中式"},
    {name:"彰化美香牛哥", price:"100~200", time:"午晚", dist:5, type:"中式"},
    {name:"聞香牛肉麵", price:"100~200", time:"午晚", dist:15, type:"中式"},
    {name:"大王牛肉麵", price:"100~200", time:"午", dist:15, type:"中式"},
    {name:"鲁肉擔仔麵", price:"100以下", time:"午晚", dist:5, type:"中式"},
    {name:"異式義式麵食", price:"100~200", time:"午晚", dist:5, type:"西式"},
    {name:"老夫子牛排", price:"100~200", time:"午晚", dist:5, type:"西式"},
    {name:"帕司咖啡Pass", price:"100~200", time:"午晚", dist:5, type:"西式"},
    {name:"牛太郎燒肉丼", price:"100~200", time:"午晚", dist:5, type:"日式"},
    {name:"千菊丸拉麵", price:"100~200", time:"午晚", dist:10, type:"日式"},
    {name:"原山拉麵", price:"100~200", time:"午晚", dist:5, type:"日式"},
    {name:"九湯屋拉麵", price:"100~200", time:"午晚", dist:10, type:"日式"},
    {name:"拉麵小徑", price:"200以上", time:"晚", dist:10, type:"日式"},
    {name:"麵屋三金", price:"100以下", time:"午晚", dist:5, type:"日式"},
    {name:"狐狸工頭", price:"200以上", time:"午晚", dist:5, type:"日式"},
    {name:"丸盛拉麵屋", price:"100~200", time:"午晚", dist:10, type:"日式"},
    {name:"福田家咖哩", price:"100~200", time:"午晚", dist:15, type:"日式"},
    {name:"雁歸雞湯拉麵", price:"200以上", time:"午晚", dist:10, type:"日式"},
    {name:"BVKcurry", price:"200以上", time:"午晚", dist:10, type:"日式"},
    {name:"雲南小吃", price:"100~200", time:"午晚", dist:15, type:"中式"},
    {name:"大思鄉臭臭鍋", price:"100~200", time:"午晚", dist:5, type:"中式"},
    {name:"四海豆漿", price:"100~200", time:"午晚", dist:10, type:"中式"},
    {name:"寶記港式飲茶", price:"100~200", time:"晚", dist:15, type:"中式"},
    {name:"億品鍋", price:"200以上", time:"午晚", dist:10, type:"中式"},
    {name:"八方雲集", price:"100以下", time:"午晚", dist:15, type:"中式"},
    {name:"紅嬌炸粿", price:"100以下", time:"午晚", dist:5, type:"中式"},
    {name:"火鍋世家", price:"200以上", time:"午晚", dist:5, type:"中式"},
    {name:"微笑冰果室", price:"100~200", time:"午晚", dist:15, type:"中式"},
    {name:"蔡媽媽蔥油餅", price:"100以下", time:"點", dist:5, type:"無"},
    {name:"珍北平餡餅", price:"100以下", time:"點", dist:5, type:"無"},
    {name:"炸職人", price:"100~200", time:"點", dist:5, type:"無"},
    {name:"龍哥雞排", price:"100~200", time:"點", dist:10, type:"無"},
    {name:"南郭鹹酥雞", price:"100~200", time:"點", dist:5, type:"無"},
    {name:"中山豆漿", price:"100以下", time:"點", dist:10, type:"無"},
    {name:"塩彡", price:"100~200", time:"點", dist:10, type:"無"},
    {name:"鼎豆芋圓", price:"100以下", time:"點", dist:15, type:"無"},
    {name:"精誠夜市", price:"100~200", time:"點", dist:15, type:"無"}
];

let filteredList = [];
let count = 0;

function toggleTypeSelect() {
    const t = document.getElementById('timeSelect').value;
    document.getElementById('typeArea').style.display = (t === "午" || t === "晚") ? "block" : "none";
}

function initialSearch() {
    const t = document.getElementById('timeSelect').value;
    const type = document.getElementById('typeSelect').value;
    const p = document.getElementById('priceSelect').value;
    const d = parseInt(document.getElementById('distSelect').value);
    
    filteredList = data.filter(r => 
        r.time.includes(t) && 
        (t !== "午" && t !== "晚" || type === "都可" || r.type === type) && 
        (p === "不限" || r.price === p) && 
        r.dist <= d
    );
    
    count = 0;
    const res = document.getElementById('resultArea');
    res.style.display = "block";
    
    if (filteredList.length === 0) {
        res.innerHTML = "<b style='color:#ff69b4;'>😭 查無符合條件的餐廳，請重新搜尋或調整條件！</b>";
        document.getElementById('actionArea').style.display = "none";
        document.getElementById('restartArea').style.display = "block";
        return;
    }
    
    let html = `<b style='color:#333; font-size:18px;'>✨ 共找到 ${filteredList.length} 家餐廳：</b><br><br>`;
    html += filteredList.map((r, index) => `
        <div class="list-item">
            <input type="checkbox" class="select-check" data-name="${r.name}" data-index="${index}">
            <div class="list-item-content">
                <b style="color:#ff69b4; font-size:16px;">👉 ${r.name}</b><br>
                <span style="color:#888; font-size:13px;">分類: ${r.type} | 價格: ${r.price} | 距離: ${r.dist}分</span>
            </div>
        </div>
    `).join('');
    
    res.innerHTML = html;
    document.getElementById('setupArea').style.display = "none";
    document.getElementById('actionArea').style.display = "block";
    document.getElementById('restartArea').style.display = "none";
}

document.getElementById('resultArea').addEventListener('click', function(e) {
    if (e.target.classList.contains('select-check')) {
        const checks = document.querySelectorAll('.select-check');
        checks.forEach(check => {
            if (check !== e.target) {
                check.checked = false;
            }
        });
    }
});

function confirmSelection() {
    const checked = document.querySelector('.select-check:checked');
    if (!checked) {
        alert('請先勾選一家餐廳！');
        return;
    }
    const name = checked.getAttribute('data-name');
    const googleLink = `https://www.google.com/maps/search/?api=1&query=$${encodeURIComponent(name)}`;
    
    document.getElementById('modalRestaurantName').textContent = name;
    document.getElementById('modalGoogleLink').href = googleLink;
    document.getElementById('confirmModal').style.display = 'flex';
    document.getElementById('actionArea').style.display = 'none';
}

function modalRestart() {
    document.getElementById('confirmModal').style.display = 'none';
    document.getElementById('actionArea').style.display = 'block';
}

function drawMore() {
    count++;
    if (count === 4) {
        document.getElementById('actionArea').style.display = "none";
        document.getElementById('resultArea').innerHTML += `<div style="color:red; font-weight:bold; font-size:20px; text-align:center; margin-top:15px; background:#ffe4e1; padding:15px; border-radius:10px;">沒有其他選項了，請重新搜尋！</div>`;
        document.getElementById('restartArea').style.display = "block";
        return;
    }
    
    filteredList.sort(() => Math.random() - 0.5);
    const picks = filteredList.splice(0, 3);
    
    if (picks.length === 0) {
        document.getElementById('actionArea').style.display = "none";
        document.getElementById('resultArea').innerHTML += `<div style="color:red; font-weight:bold; text-align:center; margin-top:10px;">已經沒有符合的店家了！</div>`;
        document.getElementById('restartArea').style.display = "block";
        return;
    }

    let html = `<div style="background:#fff0f5; padding:12px; margin-top:10px; border-radius:8px;"><b>🔮 第 ${count} 次抽籤：</b><br>`;
    html += picks.map((r, index) => `
        <div class="list-item">
            <input type="checkbox" class="select-check" data-name="${r.name}" data-index="drawn-${index}">
            <div class="list-item-content">
                ➡️ <b>${r.name}</b> <span style="font-size:12px; color:#666;">(${r.type} / ${r.price} / ${r.dist}分)</span>
            </div>
        </div>
    `).join('');
    html += `</div>`;
    
    const res = document.getElementById('resultArea');
    res.innerHTML += html;
    res.scrollTop = res.scrollHeight;
}

function resetApp() {
    document.getElementById('confirmModal').style.display = 'none';
    document.getElementById('setupArea').style.display = "block";
    document.getElementById('resultArea').style.display = "none";
    document.getElementById('resultArea').innerHTML = "";
    document.getElementById('actionArea').style.display = "none";
    document.getElementById('restartArea').style.display = "none";
    count = 0;
    filteredList = [];
}
</script>
</body>
</html>
