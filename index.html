<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全家逃離指南:通靈點餐機</title>
    <script src="restaurants.js"></script>
    <style>
        :root { --main-pink: #ff69b4; --dark-pink: #ff1493; --light-pink: #fff0f5; }
        body { font-family: 'Segoe UI', sans-serif; background: #fff0f5; display: flex; justify-content: center; padding: 20px; min-height: 100vh; margin: 0; }
        .app-card { background: white; width: 100%; max-width: 400px; border-radius: 25px; padding: 25px; box-shadow: 0 15px 35px rgba(255,105,180,0.2); position: relative; }
        h2 { text-align: center; color: var(--main-pink); margin: 0; font-size: 24px; }
        .sub { text-align: center; color: #ffb6c1; font-size: 13px; margin-bottom: 20px; }
        
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--main-pink); font-size: 14px; }
        select, button { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #ffe4e1; font-size: 16px; margin-top: 5px; outline: none; transition: 0.2s; }
        
        button:active { transform: scale(0.96); }
        .btn-main { background: var(--main-pink); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; }
        
        .result-box { margin-top: 20px; padding: 15px; background: #fffafa; border-radius: 15px; border: 1px solid #ffe4e1; max-height: 380px; overflow-y: auto; }
        
        .btn-row { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
        .btn-confirm { flex: 1; background: var(--dark-pink); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; min-width: 120px; }
        .btn-rand { flex: 1; background: var(--main-pink); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; min-width: 120px; }
        .btn-restart-inline { width: 100%; background: #ffb6c1; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-exclude { width: 100%; background: #777; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        .list-item { margin-bottom: 10px; border-bottom: 1px solid #ffe4e1; padding: 10px; display: flex; align-items: flex-start; cursor: pointer; border-radius: 10px; transition: 0.2s; }
        .list-item:hover { background: var(--light-pink); }
        .select-check { margin-top: 4px; margin-right: 12px; transform: scale(1.3); pointer-events: none; }
        .list-item-content { flex: 1; pointer-events: none; }

        .rolling-text { text-align: center; padding: 40px; font-size: 22px; color: var(--dark-pink); font-weight: bold; animation: pulse 0.1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; width: 85%; max-width: 320px; border-radius: 20px; padding: 25px; text-align: center; }
        .modal-name { font-size: 20px; font-weight: bold; color: var(--main-pink); margin-bottom: 20px; border: 2px solid var(--light-pink); padding: 15px; border-radius: 12px; }
        
        .modal-btn-grid { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn-row-top { display: flex; gap: 10px; }
        .btn-modal-cancel { flex: 1; background: #ccc; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-modal-google { flex: 1; background: #34a853; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        
        .angry-text { font-size: 22px; color: #e74c3c; font-weight: bold; margin-bottom: 20px; line-height: 1.5; }

        .feedback-text { text-align: center; font-size: 12px; color: #aaa; margin-top: 25px; padding-top: 15px; border-top: 1px dashed #ffe4e1; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>全家逃離指南:通靈點餐機</h2>
    <div class="sub">校園周邊美食隨機推薦系統</div>
    
    <div id="setupArea">
        <label>🕒 時段</label>
        <select id="timeSelect" onchange="toggleTypeSelect()">
            <option value="早">早餐</option><option value="午" selected>午餐</option><option value="晚">晚餐</option><option value="點">點心</option>
        </select>
        <div id="typeArea">
            <label>🍱 種類</label>
            <select id="typeSelect">
                <option value="西式">1. 西式</option>
                <option value="日式">2. 日式</option>
                <option value="韓式">3. 韓式</option>
                <option value="中式">4. 中式</option>
                <option value="無">5. 其他</option>
                <option value="都可" selected>6. 都可</option>
            </select>
        </div>
        <label>💰 預算</label>
        <select id="priceSelect">
            <option value="100以下">100以下</option><option value="100~200" selected>100~200</option><option value="200以上">200以上</option><option value="不限">不限</option>
        </select>
        <label>🛵 騎車時間</label>
        <select id="distSelect">
            <option value="5">5分鐘內</option><option value="10">10分鐘內</option><option value="15">15分鐘內</option><option value="999" selected>不限距離</option>
        </select>
        <button class="btn-main" onclick="initialSearch()">🔍 啟動通靈搜尋</button>
    </div>

    <div id="resultArea" class="result-box" style="display:none;"></div>
    
    <div id="actionArea" style="display:none; text-align:center; margin-top:15px;">
        <div id="hintText" style="font-weight:bold; color:#ff69b4; margin-bottom:10px;">🤔 決定好了嗎？</div>
        
        <div id="drawSetup" style="margin-bottom: 12px;">
            <label style="display:inline-block; margin:0; margin-right:5px; color:var(--dark-pink);">🎲 欲抽數量：</label>
            <select id="drawNumSelect" style="width:auto; padding:5px 15px; border-radius:8px; display:inline-block; margin:0;">
                <option value="1" selected>1 家</option>
                <option value="2">2 家</option>
                <option value="3">3 家</option>
            </select>
        </div>

        <div class="btn-row">
            <button id="confirmBtn" class="btn-confirm" onclick="confirmSelection()">✅ 確認勾選</button>
            <button id="randBtn" class="btn-rand" onclick="drawWithAnimation()">🎲 隨便抽</button>
            <button id="excludeBtn" class="btn-exclude" onclick="toggleExcludeMode()">🚫 排除名單模式</button>
            <button class="btn-restart-inline" onclick="resetApp()">🔄 重新通靈</button>
        </div>
    </div>

    <div class="feedback-text">
        💡 遇到 Bug 或有推薦的美食？<br>
        開發者信箱：s1454053@gm.ncue.edu.tw
    </div>
</div>

<div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
        <div id="modalRestaurantName" class="modal-name">店名</div>
        <div class="modal-btn-grid">
            <div class="modal-btn-row-top">
                <button class="btn-modal-cancel" onclick="closeModal()">取消</button>
                <a id="modalGoogleLink" href="#" target="_blank" class="btn-modal-google">Google Map</a>
            </div>
            <button class="btn-restart-inline" style="margin:0" onclick="resetApp()">重新通靈</button>
        </div>
    </div>
</div>

<div id="angryModal" class="modal-overlay">
    <div class="modal-content">
        <div class="angry-text">😡<br>這麼難搞就吃全家啦！！</div>
        <button class="btn-main" style="margin:0" onclick="resetApp()">🔄 重新通靈 (重置)</button>
    </div>
</div>

<script>
let filteredList = [];
let isExcludeMode = false;
let drawCount = 0;

function toggleTypeSelect() {
    const t = document.getElementById('timeSelect').value;
    document.getElementById('typeArea').style.display = (t === "午" || t === "晚") ? "block" : "none";
}

function initialSearch() {
    const t = document.getElementById('timeSelect').value;
    const type = document.getElementById('typeSelect').value;
    const p = document.getElementById('priceSelect').value;
    const d = parseInt(document.getElementById('distSelect').value);
    
    filteredList = data.filter(r => r.time.includes(t) && (t !== "午" && t !== "晚" || type === "都可" || r.type === type) && (p === "不限" || r.price === p) && r.dist <= d);
    
    // 排序：距離由大到小（15分 ➔ 10分 ➔ 5分）
    filteredList.sort((a, b) => b.dist - a.dist);
    
    drawCount = 0;
    renderList();
    document.getElementById('setupArea').style.display = "none";
    document.getElementById('actionArea').style.display = "block";
}

function renderList() {
    const res = document.getElementById('resultArea');
    res.style.display = "block";
    if (filteredList.length === 0) {
        res.innerHTML = "<b>😭 列表中已無符合條件的店家！</b>";
        return;
    }
    res.innerHTML = `<b>✨ 搜尋結果 (${filteredList.length})：</b><br><br>` + 
        filteredList.map((r, i) => `
            <div class="list-item" onclick="handleItemClick(this)">
                <input type="checkbox" class="select-check" data-name="${r.name}">
                <div class="list-item-content"><b>👉 ${r.name}</b><br><small>${r.type === "無" ? "其他" : r.type} | ${r.price} | ${r.dist}分</small></div>
            </div>`).join('');
}

function handleItemClick(el) {
    const cb = el.querySelector('.select-check');
    if (!isExcludeMode) {
        const wasChecked = cb.checked;
        document.querySelectorAll('.select-check').forEach(c => c.checked = false);
        if (!wasChecked) {
            cb.checked = true;
        }
    } else {
        cb.checked = !cb.checked;
    }
}

function drawWithAnimation() {
    if (filteredList.length === 0) {
        alert("名單中已經沒有店家可以抽囉！");
        return;
    }

    if (drawCount >= 3) {
        document.getElementById('angryModal').style.display = 'flex';
        return;
    }

    const res = document.getElementById('resultArea');
    const originalContent = res.innerHTML;
    let timer = 0;
    const duration = 1200;

    document.getElementById('actionArea').style.opacity = "0.5";
    document.getElementById('randBtn').disabled = true;

    const interval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * filteredList.length);
        res.innerHTML = `<div class="rolling-text">🔮 正在通靈...<br><br>${filteredList[randomIndex].name}</div>`;
        timer += 100;
        if (timer >= duration) {
            clearInterval(interval);
            res.innerHTML = originalContent;
            finalizeDraw();
        }
    }, 100);
}

function finalizeDraw() {
    drawCount++;
    document.getElementById('actionArea').style.opacity = "1";
    document.getElementById('randBtn').disabled = false;
    
    // 取得使用者想要抽幾家 (如果剩下的不夠抽，就只抽剩下的數量)
    let numToDraw = parseInt(document.getElementById('drawNumSelect').value);
    numToDraw = Math.min(numToDraw, filteredList.length);
    
    let pickedItemsHtml = "";
    
    // 使用迴圈一次抽出多個店家，並組裝 HTML
    for(let i = 0; i < numToDraw; i++) {
        const randomIndex = Math.floor(Math.random() * filteredList.length);
        const pick = filteredList.splice(randomIndex, 1)[0]; 
        
        pickedItemsHtml += `
            <div class="list-item" onclick="handleItemClick(this)">
                <input type="checkbox" class="select-check" data-name="${pick.name}">
                <div class="list-item-content">➡️ ${pick.name}</div>
            </div>`;
    }
    
    const res = document.getElementById('resultArea');
    const drawHtml = `<div style="background:var(--light-pink); padding:10px; margin-top:10px; border-radius:12px; border:2px dashed var(--main-pink);"><b>🔮 第 ${drawCount} 次抽籤結果：</b><br>` + pickedItemsHtml + `</div>`;
    
    res.innerHTML += drawHtml;
    res.scrollTop = res.scrollHeight;
}

function toggleExcludeMode() {
    isExcludeMode = !isExcludeMode;
    const btn = document.getElementById('excludeBtn');
    const hint = document.getElementById('hintText');
    const drawSetup = document.getElementById('drawSetup');

    if (isExcludeMode) {
        btn.innerText = "❌ 確認剔除所選項目";
        btn.style.background = "#e74c3c";
        hint.innerText = "🚫 排除模式：勾選不想吃的，再按一次按鈕剔除。";
        document.getElementById('confirmBtn').style.display = "none";
        document.getElementById('randBtn').style.display = "none";
        if (drawSetup) drawSetup.style.display = "none"; // 排除模式下隱藏抽籤數量選單
    } else {
        const checked = document.querySelectorAll('.select-check:checked');
        const namesToRemove = Array.from(checked).map(c => c.getAttribute('data-name'));
        filteredList = filteredList.filter(r => !namesToRemove.includes(r.name));
        
        btn.innerText = "🚫 排除名單模式";
        btn.style.background = "#777";
        hint.innerText = "🤔 決定好了嗎？";
        document.getElementById('confirmBtn').style.display = "block";
        document.getElementById('randBtn').style.display = "block";
        if (drawSetup) drawSetup.style.display = "block"; // 恢復顯示
        renderList();
    }
}

function confirmSelection() {
    const checked = document.querySelector('.select-check:checked');
    if (!checked) { alert("請先從列表中勾選一家餐廳！"); return; }
    const name = checked.getAttribute('data-name');
    
    document.getElementById('modalRestaurantName').textContent = name;
    // 綁定 Google Map 官方標準 Search API 網址
    document.getElementById('modalGoogleLink').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
    
    document.getElementById('confirmModal').style.display = 'flex';
}

function closeModal() { document.getElementById('confirmModal').style.display = 'none'; }

function resetApp() {
    document.getElementById('confirmModal').style.display = 'none';
    document.getElementById('angryModal').style.display = 'none';
    document.getElementById('setupArea').style.display = "block";
    document.getElementById('resultArea').style.display = "none";
    document.getElementById('resultArea').innerHTML = "";
    document.getElementById('actionArea').style.display = "none";
    
    filteredList = [];
    isExcludeMode = false;
    drawCount = 0;
    
    // 恢復抽籤數量預設為 1
    document.getElementById('drawNumSelect').value = "1";
    
    const btn = document.getElementById('excludeBtn');
    btn.innerText = "🚫 排除名單模式";
    btn.style.background = "#777";
    document.getElementById('confirmBtn').style.display = "block";
    document.getElementById('randBtn').style.display = "block";
    const drawSetup = document.getElementById('drawSetup');
    if(drawSetup) drawSetup.style.display = "block";
    document.getElementById('hintText').innerText = "🤔 決定好了嗎？";
}
</script>
</body>
</html>
